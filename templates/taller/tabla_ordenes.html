<div class="table-wrap"><table><thead><tr><th>Orden / vehículo</th><th>Cliente</th><th>Estado</th><th>Entrada</th></tr></thead><tbody>{% for orden in ordenes %}<tr><td><a class="strong" href="{% url 'taller:orden_detalle' orden.pk %}">{{ orden.referencia }}</a><small>{{ orden.vehiculo.matricula }} · {{ orden.vehiculo.marca }}</small></td><td>{{ orden.vehiculo.cliente }}</td><td><span class="badge {{ orden.estado }}">{{ orden.get_estado_display }}</span></td><td>{{ orden.entrada|date:'d/m H:i' }}</td></tr>{% empty %}<tr><td colspan="4" class="empty">Todavía no hay órdenes en esta vista.</td></tr>{% endfor %}</tbody></table></div>
